name: CUPS Print Server
version: "0.1-dev5"
slug: cups
description: CUPS print server for network printing, with Avahi
arch:
  - amd64
  - aarch64
usb: true
init: false
homeassistant_api: true
host_network: true
ports:
  631/tcp: 631
  631/udp: 631
ports_description:
  631/tcp: For other devices on the local network to print to this server
  631/udp: For other devices on the local network to print to this server
# ingress: false
map:
  - addon_config:rw
image: ghcr.io/anarchobooleanism/ha-cups-app
